name: public-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, full SHA pin
      - run: python3 scripts/public-privacy-scan.py
      - run: bash -n install.sh setup-target.sh upgrade.sh uninstall.sh scripts/package-release.sh macos-helper/build.sh macos-helper/setup-signing.sh
      - run: python3 -m compileall -q src tests
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v
