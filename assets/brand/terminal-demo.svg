.6.2.tar.gz: OK</text><text x="115" y="278" class="g">Linux-macctl 0.6.2 安装完成。</text><text x="115" y="350">$ sudo macctl version</text><text x="115" y="395" class="b">{&quot;macctl&quot;:&quot;0.6.2&quot;,&quot;transport&quot;:&quot;openssh&quot;,&quot;auth&quot;:&quot;publickey&quot;}</text><text x="115" y="470">$ python3 macctl.py --help</text><text x="115" y="515" class="m">version ping status health wake capabilities fleet doctor auth artifact exec script file</text><text x="115" y="555" class="m">push pull process launchd logs system power update brew workstation linux sync backup job</text><text x="115" y="595" class="m">messaging clipboard browser gui policy transaction security audit control</text><text x="115" y="675">$ python3 macctl.py browser --help</text><text x="115" y="720" class="g">session-navigate · query · extract · wait · analyze · click · upload · download · …</text><text x="115" y="790" class="b">$ _</text></g><text x="800" y="48" text-anchor="middle" class="t mid" font-weight="800">真实公开命令面 · Real Public CLI Surface</text></svg>