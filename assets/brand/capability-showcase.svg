<text x="1330" y="475" class="b">helper-screen-ocr</text><text x="1330" y="510" class="b">helper-accessibility-inventory</text><text x="1330" y="575" class="g">✓ Accessibility / AX</text><text x="1330" y="610" class="g">✓ ScreenCaptureKit</text><text x="1330" y="645" class="g">✓ Apple Vision OCR</text><text x="1330" y="680" class="g">✓ postcondition verification</text><text x="1330" y="715" class="warn">TCC requires human approval</text></g><g><rect x="55" y="850" width="410" height="155" rx="24" class="panel2"/><rect x="485" y="850" width="410" height="155" rx="24" class="panel2"/><rect x="915" y="850" width="410" height="155" rx="24" class="panel2"/><rect x="1345" y="850" width="520" height="155" rx="24" class="panel2"/><text x="85" y="900" class="t mid" font-weight="800">🧑‍💻 工作站资格化</text><text x="85" y="938" class="eng small">Workstation Qualification</text><text x="85" y="977" class="g small">Inventory ≠ Live Qualified</text><text x="515" y="900" class="t mid" font-weight="800">🐧 Linux 舰队</text><text x="515" y="938" class="eng small">Remote Linux Fleet</text><text x="515" y="977" class="g small">Root ops · systemd · logs</text><text x="945" y="900" class="t mid" font-weight="800">💬 微信委托消息</text><text x="945" y="938" class="eng small">WeChat Delegated Messaging</text><text x="945" y="977" class="g small">Allowlist · dedupe · rate limit</text><text x="1375" y="900" class="t mid" font-weight="800">🛡 策略 / 审计 / 恢复</text><text x="1375" y="938" class="eng small">Policy / Audit / Recovery</text><text x="1375" y="977" class="g small">Fail-closed · evidence · reconcile</text></g><text x="960" y="1050" text-anchor="middle" class="m tiny">视觉为脱敏重绘；命令面与能力边界来自公开源码和已完成资格化。 · Sanitized redraw based on public CLI surfaces and qualified capabilities.</text></svg>