<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="0.5" stop-color="#071a2f"/><stop offset="1" stop-color="#041019"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#19b9ff"/><stop offset="0.55" stop-color="#20e0d0"/><stop offset="1" stop-color="#65f58b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#eef8ff}.m{fill:#8fb8d5}.g{fill:#56edaa}.b{fill:#54c9ff}.panel{fill:#081827;stroke:#19466a;stroke-width:2}.panel2{fill:#0a2033;stroke:#1f5e87;stroke-width:2}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;fill:#cdeeff}.tiny{font-size:20px}.small{font-size:24px}.mid{font-size:32px}.big{font-size:56px;font-weight:800}.hero{font-size:72px;font-weight:900}.eng{fill:#9ecbe5}.line{stroke:url(#accent);stroke-width:5;fill:none;stroke-linecap:round}.dash{stroke:#15415f;stroke-width:1}.ok{fill:#55eca8}.warn{fill:#ffcc66}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="70" y="70" class="t big">浏览器自动化：不是裸奔的 eval，而是受策略约束的执行面</text><text x="70" y="112" class="eng mid">Browser automation without surrendering control boundaries.</text><rect x="70" y="160" width="1460" height="660" rx="30" class="panel"/><rect x="105" y="200" width="920" height="570" rx="22" fill="#06131f" stroke="#245f83"/><rect x="105" y="200" width="920" height="58" rx="22" fill="#0d2638"/><circle cx="140" cy="229" r="9" fill="#ff6b6b"/><circle cx="170" cy="229" r="9" fill="#ffd166"/><circle cx="200" cy="229" r="9" fill="#55eca8"/><rect x="260" y="214" width="690" height="30" rx="15" fill="#051019" stroke="#225270"/><text x="285" y="236" class="mono tiny">https://example.com/docs · EXACT HOST ✓</text><text x="145" y="315" class="t mid" font-weight="800">Product Documentation</text><text x="145" y="360" class="m small">Getting Started</text><rect x="145" y="395" width="825" height="105" rx="16" fill="#0b1e2e"/><text x="175" y="438" class="mono tiny">$ macctl browser session-navigate …</text><text x="175" y="474" class="g tiny">✓ URL authority verified · query stripped from output</text><rect x="145" y="530" width="825" height="190" rx="16" fill="#051019"/><g class="mono tiny"><text x="175" y="570">session-query      h1 → &quot;Getting Started&quot;</text><text x="175" y="607">session-extract    visible text → bounded result</text><text x="175" y="644">session-wait       expected text → PASS</text><text x="175" y="681">session-download   exact bytes → SHA-256 PASS</text></g><rect x="1070" y="200" width="415" height="570" rx="22" fill="#081a29" stroke="#245f83"/><text x="1105" y="252" class="t mid" font-weight="800">控制边界</text><text x="1105" y="286" class="eng small">Control Boundaries</text><g class="t small"><text x="1105" y="350">✓ Exact-host allowlist</text><text x="1105" y="398">✓ CDP primary route</text><text x="1105" y="446">✓ AX semantic fallback</text><text x="1105" y="494">✓ Vision fallback</text><text x="1105" y="542">✓ Secret-value redaction</text><text x="1105" y="590">✓ Action lock &amp; recovery</text><text x="1105" y="638">✓ Exact-byte download</text><text x="1105" y="686" class="warn">Publish / payment / account</text><text x="1105" y="720" class="warn">security → separately gated</text></g><text x="800" y="860" text-anchor="middle" class="m tiny">脱敏资格化演示 · Sanitized qualified workflow rendering</text></svg>