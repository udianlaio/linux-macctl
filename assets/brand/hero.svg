anel"/><text x="125" y="290">🌐 浏览器自动化</text><text x="125" y="324" class="eng small">Browser Automation</text><rect x="90" y="375" width="360" height="95" rx="24" class="panel"/><text x="125" y="415">🖥 工作站控制</text><text x="125" y="449" class="eng small">Workstation Control</text><rect x="90" y="500" width="360" height="95" rx="24" class="panel"/><text x="125" y="540">🐧 Linux 服务器舰队</text><text x="125" y="574" class="eng small">Remote Linux Fleet</text><rect x="1470" y="250" width="360" height="95" rx="24" class="panel"/><text x="1505" y="290">🍎 macOS 远程控制</text><text x="1505" y="324" class="eng small">macOS Remote Control</text><rect x="1470" y="375" width="360" height="95" rx="24" class="panel"/><text x="1505" y="415">💬 委托消息</text><text x="1505" y="449" class="eng small">Delegated Messaging</text><rect x="1470" y="500" width="360" height="95" rx="24" class="panel"/><text x="1505" y="540">📦 产物与证据</text><text x="1505" y="574" class="eng small">Artifacts &amp; Evidence</text></g><path d="M450 298 C650 298 680 370 775 395" class="line"/><path d="M450 423 C650 423 690 420 775 420" class="line"/><path d="M450 548 C650 548 680 470 775 445" class="line"/><path d="M1145 395 C1240 370 1270 298 1470 298" class="line"/><path d="M1145 420 C1240 420 1270 423 1470 423" class="line"/><path d="M1145 445 C1240 470 1270 548 1470 548" class="line"/><text x="960" y="92" text-anchor="middle" class="t hero">把 Mac 当作基础设施来控制，把自动化当作软件来构建。</text><text x="960" y="145" text-anchor="middle" class="eng mid">Control Macs like infrastructure. Automate them like software.</text><text x="960" y="202" text-anchor="middle" class="t mid" font-weight="700">面向 macOS 的安全自动化与控制平面 —— 来自 Linux。</text><text x="960" y="236" text-anchor="middle" class="eng small">Secure automation &amp; control plane for macOS — from Linux.</text><text x="960" y="736" text-anchor="middle" class="t mid" font-weight="800">从一台 Linux，扩展到 Mac、浏览器、工作站、服务器与真实业务工作流。</text><text x="960" y="775" text-anchor="middle" class="eng small">One gateway. Multiple execution domains. One policy-aware control plane.</text></svg>