[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-macctl"
version = "0.6.2"
description = "Security-first Linux control plane for macOS automation, browser workflows, workstation operations, fleet control, messaging, audit and recovery."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Linux-macctl contributors" }]
keywords = ["macos", "linux", "automation", "ssh", "browser-automation", "fleet-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
macctl = "linux_macctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
